# ============================================
# SIMULATION CONFIGURATION
# ============================================

# API Endpoints
api:
  prediction_url: "http://localhost:8000/predict"
  health_url: "http://localhost:8000/health"
  evidently_capture_url: "http://localhost:8001/capture"
  evidently_analyze_url: "http://localhost:8001/analyze"

# Model Configuration
model:
  name: "wine_quality_model"
  version: "1"
  feature_count: 13

# sklearn Wine Dataset Feature Ranges (the dataset used by scripts/train_model.py)
# The model is trained on 13 columns. Keep these keys as feature_0..feature_12
# because Airflow writes the Evidently reference dataset with the same names.
